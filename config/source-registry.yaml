    notes: >
      This IS the official Vietnam e-Visa portal, and the Vietnam Immigration
      Department's own portal confirms it (see vn-imm-evisa). It is NOT fetched
      from this environment, and the reason is measured rather than assumed:
      Node's fetch fails with UNABLE_TO_VERIFY_LEAF_SIGNATURE — the host serves
      an incomplete certificate chain. curl succeeds only because it is more
      lenient. The fix is NOT to disable TLS verification, which would trade a
      real security control for a demo; the portal stays a CITABLE link in the
      UI and the facts about it come from the Department's own reachable portal.

