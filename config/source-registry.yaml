version: '2.0'
verified_at: '2026-09-16'
supersedes: '1.0'

# YapYep Living Greenbook — Source Registry
#
# This registry is the input to the ingestion pipeline. Nothing may be written
# to the knowledge tables that does not trace back to an entry here.
#
# v2.0 keeps every v1.0 entry and adds the fields the pipeline needs to decide
# HOW to fetch a source, not just whether it is trustworthy.
#
# access_strategy is an ordered preference:
#   api             official API, may need credentials
#   dataset         official downloadable dataset (CSV/Parquet/JSON)
#   structured_html official page with a stable, parseable structure
#   pdf             official document
#   html            ordinary official page, needs extraction
#   manual          human-verified only; never auto-ingested
#
# authority: A = government/regulator/official university · B = official partner
# body · C = reputable secondary · D = community anecdote (never authoritative)
#
# crawl_allowed: false means the source may be cited and linked but must never
# be mirrored into R2. YouTube and TikTok are always false.

policy:
  allowed_status:
    - verified_official
    - candidate_verify_before_ingest
  admin_fact_requires:
    - authority A or B
    - freshness metadata
    - source URL
  robots_and_terms: must be checked before crawling
  people_scraping: forbidden
  tier_rule: Tier C/D content may never override a Tier A/B fact
  no_url_rule: An administrative fact with no concrete source URL cannot become
    verified. It may exist only as unverified and must not appear in critical guidance.

coverage:
  deep: [VN, SG, MY, TH, ID, PH]
  baseline: [BN, KH, LA, MM, TL]

categories:
  - immigration
  - higher_education
  - university
  - payments
  - banking
  - telecom
  - transport
  - healthcare
  - emergency
  - campus_support
  - student_life
  - culture_language
  # Carried over from v1.0 entries. Kept so existing sources stay valid rather
  # than being silently rewritten to fit a new taxonomy.
  - regional
  - mobility
  - education
  - higher-education
  - student-pass
  - student-visa
  - visa
  - arrival
  - international-student
  - government
  - culture
  - communication
  - research

# Fetching policy. Measured, not assumed.
fetch_policy:
  user_agent: >
    Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)
    Chrome/140.0.0.0 Safari/537.36
  user_agent_reason: >
    Measured 2026-09-16: sbv.gov.vn returns 403 to an identifying custom agent and
    200 to a browser agent. Other government hosts are indifferent to the agent.
  respect_robots: true
  request_delay_ms: 1500
  timeout_ms: 20000
  max_concurrency: 4
  note: >
    A user agent is not a bypass. Where a host refuses this environment's egress
    IP regardless of agent, the source is recorded as blocked and is NOT fetched;
    it stays citable in the UI with a link to the official page.

