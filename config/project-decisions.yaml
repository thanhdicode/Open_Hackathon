  tablet_600_1023: compact-rail 2-column-only-when-meaningful
  desktop_1024_plus: left-rail-220px main-column-680-800px optional-context-panel-280-320px
  breakpoints_follow_content: true
  touch_target_minimum_px: 44
prohibited_changes_without_approval:
- framework migration
- new bottom-nav tab
- rename DNA concepts
- remove source/freshness
- unsourced administrative guidance
- new state-management framework
- new UI library
