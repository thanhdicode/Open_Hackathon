phase5_connect_explore:
  implemented_at: '2026-09-16'
  scope: 'Connect (community feed + people discovery) and Explore (real map) — ran in parallel with Phase 4'
  product_thesis: 'Greenbook = verified institutional knowledge; YapLens/YapSim = AI interpretation and practice; Connect + Explore = lived student experience'
  connect:
    shape: 'Community (default) + People; messaging explicitly out of scope, chat infrastructure untouched'
    filters: 'For You, Host Country, My University, Tips, Places, Questions, Moments, Saved'
    post_types: 'moment, tip, question, place, warning, guide, culture, study'
    matching: 'deterministic scoring with human-readable reasons; no ML recommender, no opaque compatibility score'
    realtime: 'one subscription per authenticated user on community_posts; HTTP query remains the source of truth'
  explore:
    map: 'MapLibre GL JS + OpenFreeMap basemap + OpenStreetMap data; style URL is configurable because the public basemap has no SLA'
    replaced: 'the hand-drawn SVG grid map is deleted, not hidden'
    poi_source: 'OpenStreetMap via Overpass, bootstrapped once by scripts/explore/bootstrap-osm.mjs and cached in Appwrite'
    no_google_maps: true
    attribution: 'OpenStreetMap attribution asserted by the browser gate, not assumed'
  appwrite:
    tables_created: 'community_posts, post_media, post_reactions, post_comments, saved_posts, place_contributions, place_saves, place_collections, follows, reports'
    tables_reused: 'student_social_profiles (extended), places (extended with OSM identity + community counters), user_blocks, universities (seeded)'
    bucket_added: community_media
    permissions: 'row security on every new table; a student can read another student''s public post but can never update or delete it'
  seed:
    provenance: 'every synthetic row carries is_demo_seed + seed_origin=demo + verification=synthetic_demo; none is ever marked verified_student/real_user/partner_student'
    places: '8419 OpenStreetMap POIs + 11 curated anchors = 8430 rows across MY/SG/ID/TH/PH/VN'
    community: '12 demo profiles, 10 demo posts, 28 comments, 68 reactions, 24 post saves, 41 place saves, 9 media rows, 6 place contributions'
  safety:
    live_location: 'out of scope by decision — shared places and experiences only; no precise current coordinates are ever published'
    controls: 'block, report, discoverability off'
  evidence:
    data_and_permissions: docs/evidence/phase5/verify.json (33/33)
    browser: docs/evidence/phase5/browser.json (37/37 across 390x844, 430x932, 768x1024, 1440x900)
    seed: docs/evidence/phase5/seed-report.json
    osm_bootstrap: docs/evidence/phase5/osm-bootstrap.json
    report: docs/evidence/phase5/FINAL_REPORT.md
  harness_fixes:
    - 'scripts/verify/lib/onboarding.mjs: completion is now confirmed over a settle rather than sampled, and the walker tolerates momentarily un-clickable screens — the previous walker reported a false pass while the country picker was on screen, and ended the walk on the first idle step'
    - 'scripts/verify/lib/onboarding.mjs: option chips are clicked once per screen; re-clicking toggled the answer off and stalled the goals step'
    - 'src/features/Onboarding.tsx: added data-testid="onboarding" so "is onboarding still showing" is structural rather than a list of step titles that missed "Where are you going?"'
