phase3_ai_core:
  implemented_at: '2026-09-16'
  decision: docs/adr/ADR-004-phase3-ai-interaction-core.md
  contracts:
    split: '18 per-operation Zod contracts, replacing the shared Lens-shaped result'
    server: functions/ai-gateway/src/contracts.js
    client: src/lib/ai-contracts/*.ts
    generated_schemas: schemas/*.schema.json (npm run schemas:generate)
    parity_test: npm run test:contracts — 39/39 passing
    invented_defaults_removed: true   # the gateway normalize() repair path is deleted
  gateway:
    routes: 15
    files: 'contracts.js providers.js prompts.js routes.js privacy.js audio.js languages.js live-languages.js main.js'
    fallback: 'gemini primary -> gemini-3.7-flash; groq primary -> gemini text'
    validation_repair: 'one repair retry with the Zod issue list, then SCHEMA_INVALID'
    error_codes: 'RATE_LIMITED, SCHEMA_INVALID, AI_UNAVAILABLE, AI_EMPTY, NOT_CONFIGURED, LANGUAGE_UNSUPPORTED, INVALID_FILE, FILE_TOO_LARGE, UNSUPPORTED_MEDIA, EMPTY_TRANSCRIPT, BAD_REQUEST, NOT_FOUND'
  scene_lens:
    implemented: 'real camera/gallery capture, client-side downscale, normalized box overlay, region detail'
    overlay: 'CSS-percentage boxes over the original photo; the source image is never regenerated'
    uncertainty: 'per-region uncertainty plus a mandatory safetyNotice stating what the photo cannot establish'
  conversation_bridge:
    implemented: 'turn-based, push-to-talk or upload, two lanes (translation then coaching)'
    coach_asks_user: true   # the coach never answers on the student's behalf
    persistence: 'NOT implemented — sessions are in memory only'
  ai_language_profile:
    implemented: 'src/lib/preferences.ts — explanation language, local languages, level, romanization, speed, auto-speak, transcript retention'
    country_decides_language: false   # the host country only supplies a suggestion
  live_ux:
    fake_timers_removed_from_lens: true
    activity_source: 'src/lib/ai/activity.ts — driven by the real request lifecycle'
    provenance_shown: 'provider, model, latency and repair count are surfaced to the user'
  yapsim:
    implemented: 'real simulator — no seeded transcript, no timer, no pre-baked scores'
    flow: '/sim/start -> 3-5 real /sim/turn -> /sim/finish'
    persistence: 'src/lib/appwrite/practice.ts — practice_sessions rows (owner-scoped) + skill_profiles update'
    persona_language: 'persona speaks the host language; coaching stays in the user language'
    beginner_mode: 'bilingual subtitle always shown; advanced shows the local line first with translation on demand'
    retry: 'a retry is a new attempt of the same scenario; the UI states plainly that a retry can go either way'
    verified: 'docs/evidence/phase3/sim-loop.json — 3 real turns with state-tracking persona replies, 6/6 frozen dimensions, scores in range'
  reliability_phase3_5:
    implemented_at: '2026-09-16'
    decision: docs/adr/ADR-005-ai-reliability-failover.md
    registry: 'functions/ai-gateway/src/registry.js — capability chains, failover, concurrency guard, health'
    breaker: 'functions/ai-gateway/src/breaker.js — 429 opens immediately using retry-after; 503/timeout get a short growing cooldown; schema failures never open the circuit'
    chains:
      text: 'groq-text -> groq-vision -> cloudflare-text -> gemini -> openrouter'
      vision: 'groq-vision -> cloudflare-vision -> gemini -> openrouter'
      stt: 'groq-whisper -> cloudflare-whisper'
      tts: 'gemini -> browser speechSynthesis -> text only'
    gemini_is_load_bearing: false
    concurrency_guard: 'MAX_CONCURRENT default 4 with a bounded wait queue; every route is exactly one inference'
    strict_schema: 'toStrictSchema() makes every property required and optional fields nullable; stripNulls() maps null back to absent before Zod, so a null on a required field still fails'
    provider_neutral_ui: 'providerUsed / fallbackDepth / degradedProviders / unconfiguredProviders / latencyMs are telemetry; the student sees Primary AI, Backup AI, AI is busy, Voice unavailable, Text only'
    provider_status:
      groq_text: 'configured, verified working'
      groq_vision: 'configured, verified reading a real menu photo (qwen/qwen3.8-27b)'
      groq_stt: 'configured, verified (whisper-large-v3-turbo)'
      gemini: 'configured, intermittently 429/503'
      cloudflare_text: 'IMPLEMENTED BUT UNVERIFIED — CLOUDFLARE_ACCOUNT_ID is empty'
      cloudflare_vision: 'IMPLEMENTED BUT UNVERIFIED — needs CLOUDFLARE_ACCOUNT_ID'
      cloudflare_stt: 'IMPLEMENTED BUT UNVERIFIED — needs CLOUDFLARE_ACCOUNT_ID'
      openrouter: 'implemented, no OPENROUTER_API_KEY'
    measured_limits: 'groq qwen/qwen3.8-27b: 1000 RPD, 8000 TPM, and a separate 1000 output-tokens/min ceiling; one 1600px image is ~2000 tokens, so ~3 vision calls per minute'
    open_gap: 'With Cloudflare unconfigured, a simultaneous Groq+Gemini 429 still fails Scene Lens. Observed on 2026-09-16: both returned 429 in the same request.'
    acceptance:
      evidence: docs/evidence/phase3/acceptance.json
      result: '7/8 criteria met (best across runs); the acceptance script records every run so a rate-limited later run cannot erase a genuine pass'
      met:
      - text does not depend on Gemini
      - Scene Lens works with Gemini disabled
      - Conversation works with Gemini disabled
      - YapSim works with Gemini disabled
      - provider health endpoint reports all 8 providers
      - no provider secret in any response
      - concurrency guard active and bounded
      blocked:
      - 'STT has two providers — needs CLOUDFLARE_ACCOUNT_ID'
    browser_evidence:
      bridge_390: 'docs/evidence/phase3/bridge-evidence.json — 8/8, including denied-microphone fallback, no overflow, no page errors'
      lens: 'docs/evidence/phase3/lens-evidence.json — Lens renders at 390/430/768/1440, no overflow, no page errors'
    output_budget_finding: 'Groq qwen allows 1000 output tokens/minute and an 11-region Scene Lens response exceeded it alone. Capping the prompt at 8 regions with short fields: 11 regions/5.0s -> 8 regions/4.3s.'
    verification_is_self_limiting: 'Repeated acceptance runs exhaust the free tier; the script now paces between criteria (ACCEPTANCE_PACE_MS, default 20s)'
  cavoti_phase3_6:
    implemented_at: '2026-09-16'
    decision: docs/adr/ADR-006-cavoti-provider.md
    base_url: 'https://cavoti.com/v1 (discovered by probing; not documented in the brief)'
    evidence: docs/evidence/phase3/cavoti-matrix.json
    providers: 'cavoti-mimo, cavoti-qwen, cavoti-glm, cavoti-minimax, cavoti-deepseek, cavoti-hy3 — each with its own circuit so one model cannot disable the others'
    measured_capabilities:
      text_verified: [qwen3.8-flash, glm-5.3-flash, minimax-m3, deepseek-v4-flash-0731, hy3]
      vision_verified: [qwen3.8-flash, glm-5.3-flash, hy3]
      audio_verified: []   # none — every candidate returned 400 or refused inside a 200 body
      unavailable_on_plan: [mimo-v2.5, qwen-3.8-flash]   # 402 balance required
      vision_disabled: [minimax-m3, deepseek-v4-flash-0731]
    corrections_to_the_brief:
    - 'MiMo-V2.5 is NOT usable: 402 "primary balance is not positive enough". It was the brief''s highest-priority rescue model.'
    - 'qwen-3.8-flash and qwen3.8-flash are different models; only the unhyphenated ID serves.'
    - 'No Cavoti model accepts audio. Two refused inside an HTTP 200 body ("Unsupported content type … only supports text input") — counting those as passes would have shipped a false capability claim.'
    scene_lens_3_images:
      evidence: docs/evidence/phase3/scene-lens-3.json
      result: '3/3 images pass the full SceneLens contract with Gemini''s circuit forced open; served-by-Gemini = 0'
      cavoti_route_served: 'cavoti-hy3 served the Singapore campus notice, reading English + Malay + Mandarin'
      note: 'records run history and best-ever per image, because repeated verification exhausts the free tier'
    chain_deadline: 'vision 75s, text 60s — one measured Scene Lens call took 111s when four providers failed slowly in turn'
    cloudflare_now_configured: true   # account id supplied; all three cloudflare legs are healthy
